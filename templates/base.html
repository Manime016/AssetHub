<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AssetHub | {% block title %}{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <header class="header">

        <div class="logo-section">
            <h1 class="logo">AssetHub</h1>
            <span class="logo-subtitle">Asset Management System</span>
        </div>

        <nav class="navbar">

            <a href="{{ url_for('pages.dashboard') }}">Home</a>

            <a href="{{ url_for('pages.about') }}">About</a>

            <a href="{{ url_for('pages.contact') }}">Contact</a>

            <a href="{{ url_for('pages.add_employee') }}">Add Employee</a>

            <a href="{{ url_for('pages.employee_list') }}">Search Employee</a>

            <a href="{{ url_for('pages.add_asset') }}">Add Asset</a>

            <a href="{{ url_for('admin.admin_management') }}">Admin Management</a>

            <a href="{{ url_for('pages.login') }}" class="logout-btn">
                Logout
            </a>

        </nav>

    </header>

    <main class="main-content">

        {% block content %}
        {% endblock %}

    </main>

</body>
</html>
